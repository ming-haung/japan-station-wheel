<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本車站轉盤</title>
  <meta name="description" content="隨機抽取日本火車、捷運、JR 各線車站，附轉盤動畫">
  <meta property="og:title" content="日本車站轉盤">
  <meta property="og:description" content="隨機抽取日本火車、捷運、JR 各線車站">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-pattern"></div>

  <header class="header">
    <h1 class="title">
      <span class="title-icon">🎡</span>
      日本車站轉盤
    </h1>
    <p class="subtitle">隨機抽取日本火車、捷運、JR 各線車站</p>
  </header>

  <main class="main">
    <aside class="sidebar">
      <section class="panel">
        <h2 class="panel-title">選擇路線</h2>
        <div class="category-tabs" id="categoryTabs"></div>
        <div class="line-list" id="lineList"></div>
        <div class="panel-actions">
          <button class="btn btn-secondary" id="selectAllBtn">全選</button>
          <button class="btn btn-secondary" id="clearAllBtn">清除</button>
        </div>
        <p class="station-count" id="stationCount">已選 0 個車站</p>
      </section>
    </aside>

    <section class="wheel-section">
      <div class="wheel-container">
        <div class="wheel-pointer">▼</div>
        <canvas id="wheelCanvas" width="480" height="480"></canvas>
        <button class="spin-btn" id="spinBtn" disabled>
          <span class="spin-btn-text">轉動！</span>
        </button>
      </div>

      <div class="result-card" id="resultCard">
        <div class="result-placeholder">
          <span class="result-icon">🚉</span>
          <p>選擇路線後按下轉動</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
  </footer>

  <div class="cat-overlay" id="catOverlay" hidden>
    <div class="cat-overlay-backdrop"></div>
    <div class="cat-reveal">
      <div class="cat-meme">
        <img src="貓.png" alt="貓咪揭曉" class="cat-image">
        <p class="cat-caption">
          <span class="cat-caption-prefix">ㄇㄧㄠˊ？前往</span>
          <span class="cat-caption-station" id="catStationName"></span>
          <span class="cat-caption-suffix">站</span>
        </p>
        <p class="cat-prefecture" id="catStationPrefecture"></p>
      </div>
      <button class="cat-close-btn" id="catCloseBtn" type="button">知道了</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
